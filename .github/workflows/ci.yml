name: CI
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check shell scripts
        run: |
          for f in \
            scripts/*.sh \
            scripts/wan-affinity/apply-affinity.sh \
            scripts/wan-affinity/098-wan-affinity \
            scripts/wan-affinity/wan-affinity.cgi; do
            sh -n "$f"
          done
      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck -s sh --severity=warning \
            scripts/*.sh \
            scripts/wan-affinity/apply-affinity.sh \
            scripts/wan-affinity/098-wan-affinity \
            scripts/wan-affinity/wan-affinity.cgi
      - name: Verify required assets
        run: |
          test -f README.md
          test -f scripts/install-luci-addons.sh
          test -f scripts/configure-wan-affinity.sh
          test -f configs/network-nics.uci
          test -f scripts/wan-affinity/apply-affinity.sh
          test -f scripts/wan-affinity/098-wan-affinity
