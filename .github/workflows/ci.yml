name: CI
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check shell scripts
        run: |
          for f in scripts/*.sh vps/*.sh vps/tests/*.sh; do sh -n "$f"; done
      - name: Verify required assets
        run: |
          test -f README.md
          test -f scripts/configure-load-balancing.sh
          test -f scripts/install-luci-addons.sh
          test -f configs/network-nics.uci
