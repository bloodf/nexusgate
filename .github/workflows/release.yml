name: Release
on:
  push:
    tags: ['v*']
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: tar --exclude=.git -czf nexusgate-${GITHUB_REF_NAME}.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: nexusgate-${{ github.ref_name }}
          path: nexusgate-${{ github.ref_name }}.tgz
